name: verify

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            interview-reader/frontend/package-lock.json
            upgrade-console/frontend/package-lock.json
      - name: Install main frontend dependencies
        working-directory: interview-reader/frontend
        run: npm ci
      - name: Install console frontend dependencies
        working-directory: upgrade-console/frontend
        run: npm ci
      - name: Verify API contract
        working-directory: interview-reader/frontend
        run: |
          npm run api:generate
          git diff --exit-code -- src/generated/api
          npm run contract:check
      - name: Lint frontends
        run: |
          npm --prefix interview-reader/frontend run lint
          npm --prefix upgrade-console/frontend run lint
      - name: Test frontends
        run: |
          npm --prefix interview-reader/frontend test
          npm --prefix upgrade-console/frontend test
      - name: Validate production upgrade URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          UPGRADE_CONSOLE_URL: ${{ vars.UPGRADE_CONSOLE_URL }}
        run: |
          if [[ -z "$UPGRADE_CONSOLE_URL" ]]; then
            echo "::error::Set repository Actions variable UPGRADE_CONSOLE_URL"
            exit 1
          fi
          node -e 'const url = new URL(process.env.UPGRADE_CONSOLE_URL); if (url.protocol !== "https:" || url.username || url.password) { console.error("UPGRADE_CONSOLE_URL must be a credential-free HTTPS URL"); process.exit(1); }'
      - name: Build main frontend
        env:
          VITE_UPGRADE_CONSOLE_URL: ${{ vars.UPGRADE_CONSOLE_URL }}
        working-directory: interview-reader/frontend
        run: npm run build
      - name: Build console frontend
        working-directory: upgrade-console/frontend
        run: npm run build
      - name: Test backends
        run: ./mvnw --batch-mode -DskipFrontend=true test
      - name: Stamp production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: printf '%s\n' "$GITHUB_SHA" > interview-reader/src/main/resources/release-commit.txt
      - name: Package applications
        run: ./mvnw --batch-mode -DskipFrontend=true -DskipTests package
      - name: Verify packaged Vue entries
        run: |
          unzip -p interview-reader/target/interview-reader-*.jar BOOT-INF/classes/static/index.html | grep 'src="/assets/index-'
          unzip -p upgrade-console/target/interview-reader-upgrade-console-*.jar BOOT-INF/classes/static/index.html | grep 'src="/assets/index-'
      - name: Prepare production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jars=(interview-reader/target/interview-reader-*.jar)
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" interview-reader/target/interview-reader.jar
          cd interview-reader/target
          sha256sum interview-reader.jar > production-jar.sha256
      - name: Publish production JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-jar
          path: interview-reader/target/interview-reader.jar
          if-no-files-found: error
          retention-days: 90
      - name: Publish production checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-jar-sha256
          path: interview-reader/target/production-jar.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish upgrade console JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-console-jar
          path: upgrade-console/target/interview-reader-upgrade-console-*.jar
          if-no-files-found: error
          retention-days: 90